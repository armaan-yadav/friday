[project]
name = "friday"
version = "0.1.0"
description = "Real-time voice assistant: STT (Whisper/Sarvam) → LLM (LM Studio) → TTS (Kokoro), with a web UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "numpy>=2.4.4",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rapidfuzz>=3.6.0",
]

[project.scripts]
friday = "friday.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]
